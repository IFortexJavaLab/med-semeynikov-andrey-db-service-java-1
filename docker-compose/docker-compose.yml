version: '3.9'

services:
  auth_postgres:
    image: postgres:17-alpine
    container_name: auth_postgres_db
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: ifortex
      POSTGRES_PASSWORD: ifortex
      POSTGRES_DB: auth_db
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=en_US.utf8"
    volumes:
      - auth_postgres_data:/var/lib/postgresql/data

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    container_name: kyc_blob_storage
    command: azurite-blob --blobHost 0.0.0.0 --blobPort 10000 --location /data
    ports:
      - "10000:10000"
    volumes:
      - azurite_data:/data

  kyc_service_postgres:
    image: postgres:17-alpine
    container_name: kyc_service_postgres_db
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: ifortex
      POSTGRES_PASSWORD: ifortex
      POSTGRES_DB: kyc_service_db
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=en_US.utf8"
    volumes:
      - kyc_service_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:latest
    container_name: redis_auth_db
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  auth_postgres_data:
    driver: local
  azurite_data:
    driver: local
  kyc_service_postgres_data:
    driver: local
  redis_data:
    driver: local