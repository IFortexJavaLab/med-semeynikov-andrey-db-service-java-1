version: '3.9'

services:
  auth_postgres:
    image: postgres:17-alpine
    container_name: auth_postgres_db
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: ifortex
      POSTGRES_PASSWORD: ifortex
      POSTGRES_DB: auth_db
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=en_US.utf8"
    volumes:
      - auth_postgres_data:/var/lib/postgresql/data

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    container_name: kyc_blob_storage
    command: azurite-blob --blobHost 0.0.0.0 --blobPort 10000 --location /data
    ports:
      - "10000:10000"
    volumes:
      - azurite_data:/data

  kyc_service_postgres:
    image: postgres:17-alpine
    container_name: kyc_service_postgres_db
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: ifortex
      POSTGRES_PASSWORD: ifortex
      POSTGRES_DB: kyc_service_db
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=en_US.utf8"
    volumes:
      - kyc_service_postgres_data:/var/lib/postgresql/data

  emergency_service_postgres:
    image: postgres:17-alpine
    container_name: emergency_service_postgres_db
    ports:
      - "5435:5432"
    environment:
      POSTGRES_USER: ifortex
      POSTGRES_PASSWORD: ifortex
      POSTGRES_DB: emergency_service_db
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=en_US.utf8"
    volumes:
      - emergency_service_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:latest
    container_name: redis_auth_db
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  redis-geo:
    image: redis:latest
    container_name: redis_geo_db
    ports:
      - "6380:6379"
    volumes:
      - redis_geo_data:/data

  mongodb:
    image: mongo:latest
    container_name: emergency_service_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    hostname: zookeeper
    container_name: zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  broker:
    image: confluentinc/cp-kafka:7.5.0
    container_name: broker
    ports:
      - "9092:9092"
      - "29092:29092"
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: 'zookeeper:2181'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://broker:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  kafka-ui:
    container_name: kafka-ui
    image: provectuslabs/kafka-ui:latest
    ports:
      - "8087:8080"
    depends_on:
      - broker
    environment:
      KAFKA_CLUSTERS_NAME: local
      KAFKA_CLUSTERS_BOOTSTRAPSERVERS: broker:29092
      DYNAMIC_CONFIG_ENABLED: 'true'

volumes:
  auth_postgres_data:
    driver: local
  kyc_service_postgres_data:
    driver: local
  emergency_service_postgres_data:
    driver: local
  azurite_data:
    driver: local
  redis_data:
    driver: local
  redis_geo_data:
    driver: local
  mongodb_data:
    driver: local